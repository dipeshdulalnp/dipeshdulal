baseURL = "https://www.dipeshdulal.com"
languageCode = "en-us"
title = "Dipesh Dulal's Blog"

# Emit /robots.txt using layouts/robots.txt (theme default allows all crawlers + Sitemap).
enableRobotsTXT = true

[services]
  [services.googleAnalytics]
    ID = "G-XXXXXXXXXX"  # Your GA4 measurement ID

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  CoverImage = '/images/cover_image.png'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  
  # Search
  enableSearch = true  # Enable/disable site search

  # Open external links in a new tab (markdown body, social links, project cards)
  openExternalLinksInNewTab = true
  
  # Timeline Starting Point (optional)
  # timelineStart = "🚀 And so it begins..."
  # timelineStartSubText = "Additional context or details..."
  # timelineStartDate = "Jan 2023"
  
  # Giscus Comments Configuration (optional)
  # To enable comments, uncomment and set enabled = true
  # Get your values from https://giscus.app/
  # [params.giscus]
  #   enabled = false
  #   repo = "yourusername/your-comments-repo"
  #   repoId = "R_xxxxxxxxxxxxx"
  #   category = "Announcements"
  #   categoryId = "DIC_xxxxxxxxxxxxx"
  #   mapping = "pathname"  # Default: pathname
  #   strict = "0"  # Default: 0
  #   reactionsEnabled = "1"  # Default: 1
  #   emitMetadata = "0"  # Default: 0
  #   inputPosition = "top"  # Default: top (options: top, bottom)
  #   lightTheme = "light"  # Theme for light mode (default: light)
  #   darkTheme = "dark"  # Theme for dark mode (default: dark)
  #   lang = "en"  # Default: en
  #   loading = "lazy"  # Default: lazy


