baseURL = "https://www.dipeshdulal.com"
languageCode = "en-us"
title = "Dipesh Dulal's Blog"
theme = "yassi"

 [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
       unsafe = true

enableRobotsTXT = true

[services]
  [services.googleAnalytics]
    ID = "G-XXXXXXXXXX"  # Your GA4 measurement ID



[params]
  CoverImage = "/images/profile.jpg"  # or your own image
  CoverImageWidth = 150
  
  # Theme Colors
  # Accent color used for site title underline, timeline bullets, and project cards
  accentColor = "#138847"  # Light blue (default)
  accentColorDark = "#34cc8d"  # Lighter blue for dark mode
  
  # Project display mode
  useProjectCarousel = false          # or false for grid
  projectCarouselFullWidth = false   # true to break carousel out to full viewport width
  
  # Search
  enableSearch = true  # Enable site search with Fuse.js

  # Timeline filter
  enableTimelineFilter = false  # true to show All / Posts / Projects filter above the timeline
  timelineFilterStyle = "pills"  # "pills" (default) or "dropdown"
  
  # Timeline Starting Point (optional)
  timelineStart = "🚀 My blogging journey begins .."
  timelineStartSubText = "I do not remember when exactly I started."  # optional
  
  # Social Media Links
  [params.social]
   linkedin = "https://linkedin.com/in/dipeshdulal"
   youtube = "https://www.youtube.com/@dipeshdulalnp"
   googlescholar = "https://scholar.google.com/citations?authuser=1&user=NyQkpq8AAAAJ"
  
  # Giscus Comments (optional)
  [params.giscus]
    enabled = false
    repo = "yourusername/your-comments-repo"
    repoId = "R_xxxxxxxxxxxxx"
    category = "Announcements"
    categoryId = "DIC_xxxxxxxxxxxxx"
    lightTheme = "light"
    darkTheme = "dark"


[[menus.main]]
name = 'Home'
pageRef = '/'
weight = 10

[[menus.main]]
name = 'About'
pageRef = '/about/'
weight = 15

[[menus.main]]
name = 'Blog'
pageRef = '/posts/'
weight = 20

[[menus.main]]
name = 'Categories'
pageRef = '/categories/'
weight = 30

[[menus.main]]
name = 'Projects'
pageRef = '/projects/'
weight = 40

[[menus.main]]
name = 'My Bookshelf'
pageRef = '/my-bookshelf/'
weight = 45

[[menus.main]]
name = 'Contact'
pageRef = '/contact/'
weight = 50

[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"