<button id="back-to-top" class="back-to-top" aria-label="Back to top" title="Back to top"> ↑ </button> <script> const backToTop = document.getElementById("back-to-top"); window.addEventListener("scroll", () => { backToTop.classList.toggle("show", window.scrollY > 400); }); backToTop.addEventListener("click", () => { window.scrollTo({ top: 0, behavior: "smooth" }); }); </script>
